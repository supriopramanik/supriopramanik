name: Update telemetry

on:
  schedule:
    - cron: "17 2 * * *" # nightly, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate telemetry SVGs
        run: node scripts/generate-telemetry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/telemetry.svg assets/readme/contribution-grid.svg
          git diff --cached --quiet || git commit -m "chore: refresh telemetry"
          git push
